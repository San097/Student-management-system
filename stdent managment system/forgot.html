<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - OTP Verification</title>
    <link rel="stylesheet" href="forgot.css">
    <!-- Include EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>

        <!-- Forgot Password Form -->
        <form id="forgotPasswordForm">
            <label for="email">Enter Your Email:</label>
            <input type="email" id="email" placeholder="Your email address" required><br>

            <button type="submit" class="btn" onclick="generateOTP()">Send OTP</button>
        </form>

        <div id="otpSection" style="display: none;">
            <h2>Enter OTP</h2>
            <label for="otp">OTP:</label>
            <input type="text" id="otp" placeholder="Enter OTP" required><br>
            <button id="verifyBtn" class="btn">Verify OTP</button>
            <p id="otpError" style="color: red;"></p>
        </div>

        <p id="message"></p>
    </div>

    <script src="otp.js"></script>
</body>
</html>
